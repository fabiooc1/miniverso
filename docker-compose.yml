services:
  db:
    image: postgres:17-alpine
    container_name: miniverso_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miniverso_network


networks:
  miniverso_network:
    driver: bridge

volumes:
  postgres_data: